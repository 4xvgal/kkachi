<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kkachi PWA demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      button { font-size: 1rem; padding: 10px 16px; margin-right: 8px; cursor: pointer; }
      pre { background: #f4f4f4; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>kkachi push demo</h1>
    <p>Registers a service worker, subscribes to push, and registers with the kkachi server.</p>
    <p>
      <label>Relay <input id="relay" size="44" placeholder="wss://relay.example" /></label>
      <button id="saveRelay">Save relay</button>
    </p>
    <button id="enable">Enable notifications</button>
    <button id="disable">Disable</button>
    <button id="send">Send test event to me</button>
    <pre id="log"></pre>
    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
